<!DOCTYPE html>
<html lang="pl" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>QuizArena ⚡ - Wieloosobowy Quiz z Powerami</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Fredoka', 'sans-serif'],
          },
          colors: {
            kahoot: {
              red: '#e21b3c',
              redDark: '#b0102b',
              blue: '#1368ce',
              blueDark: '#0d4a96',
              yellow: '#d89e00',
              yellowDark: '#a37600',
              green: '#26890c',
              greenDark: '#1b6308',
              purple: '#46178f',
              purpleDark: '#250856'
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      background: radial-gradient(circle at 50% 0%, #3b1078 0%, #190736 55%, #0c031c 100%);
      min-height: 100vh;
      color: #ffffff;
      overflow-x: hidden;
      user-select: none;
    }

    .bg-grid-pattern {
      background-image: 
        linear-gradient(to right, rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    .btn-3d-purple {
      background: linear-gradient(180deg, #8b5cf6 0%, #6d28d9 100%);
      box-shadow: 0 6px 0 #4c1d95, 0 10px 20px rgba(0,0,0,0.4);
      transition: all 0.12s ease;
    }
    .btn-3d-purple:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 0 #4c1d95, 0 14px 24px rgba(139,92,246,0.4);
    }
    .btn-3d-purple:active:not(:disabled) {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #4c1d95;
    }

    .btn-3d-amber {
      background: linear-gradient(180deg, #fbbf24 0%, #d97706 100%);
      box-shadow: 0 6px 0 #92400e, 0 10px 20px rgba(0,0,0,0.4);
      transition: all 0.12s ease;
    }
    .btn-3d-amber:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 0 #92400e, 0 14px 24px rgba(251,191,36,0.4);
    }
    .btn-3d-amber:active:not(:disabled) {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #92400e;
    }

    .ans-red { background: linear-gradient(180deg, #f42548 0%, #d41435 100%); box-shadow: 0 7px 0 #960b23, 0 10px 18px rgba(0,0,0,0.35); }
    .ans-blue { background: linear-gradient(180deg, #1d7bf0 0%, #115cb8 100%); box-shadow: 0 7px 0 #0a3c7a, 0 10px 18px rgba(0,0,0,0.35); }
    .ans-yellow { background: linear-gradient(180deg, #f5b301 0%, #d19600 100%); box-shadow: 0 7px 0 #8f6600, 0 10px 18px rgba(0,0,0,0.35); }
    .ans-green { background: linear-gradient(180deg, #2ea310 0%, #227d0b 100%); box-shadow: 0 7px 0 #144d05, 0 10px 18px rgba(0,0,0,0.35); }
    
    .ans-card {
      transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.15s ease, opacity 0.2s ease;
    }
    .ans-card:hover:not(:disabled) {
      transform: translateY(-3px) scale(1.01);
      filter: brightness(1.08);
    }
    .ans-card:active:not(:disabled) {
      transform: translateY(5px);
    }

    @keyframes shakeHit {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      15% { transform: translate(-12px, -8px) rotate(-2deg); }
      30% { transform: translate(12px, 6px) rotate(2deg); }
      45% { transform: translate(-10px, 8px) rotate(-1.5deg); }
      60% { transform: translate(10px, -6px) rotate(1.5deg); }
      75% { transform: translate(-6px, 4px) rotate(-0.5deg); }
    }
    .animate-hit-shake { animation: shakeHit 0.55s cubic-bezier(.36,.07,.19,.97) both; }

    @keyframes pulsePower {
      0%, 100% { box-shadow: 0 0 0 0 rgba(250, 204, 21, 0.7), 0 0 25px rgba(234, 179, 8, 0.8); transform: scale(1); }
      50% { box-shadow: 0 0 0 12px rgba(250, 204, 21, 0), 0 0 40px rgba(250, 204, 21, 1); transform: scale(1.04); }
    }
    .power-ready-glow { animation: pulsePower 1.5s infinite; }

    @keyframes flameBounce {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-3px) scale(1.14); }
    }
    .flame-active { animation: flameBounce 1s ease-in-out infinite; }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: rgba(15, 7, 34, 0.6); }
    ::-webkit-scrollbar-thumb { background: rgba(139, 92, 246, 0.5); border-radius: 9999px; }
  </style>
</head>

<body class="bg-grid-pattern flex flex-col min-h-screen selection:bg-fuchsia-500 selection:text-white">

  <!-- RED FLASH OVERLAY -->
  <div id="hitFlashOverlay" class="fixed inset-0 pointer-events-none z-50 opacity-0 transition-opacity duration-300 bg-red-600/45 backdrop-blur-[2px] flex items-center justify-center">
    <div id="hitOverlayBanner" class="bg-red-950/95 border-4 border-red-400 rounded-3xl px-8 py-6 text-center shadow-2xl transform scale-90 transition-transform duration-300">
      <div class="text-6xl mb-2" id="hitOverlayIcon">💥</div>
      <h2 class="font-display text-3xl md:text-4xl font-bold text-red-200 tracking-wide uppercase" id="hitOverlayTitle">ZOSTAŁEŚ TRAFIONY POWEREM!</h2>
      <p class="text-lg md:text-xl text-white font-semibold mt-2" id="hitOverlayDesc"></p>
    </div>
  </div>

  <canvas id="confettiCanvas" class="fixed inset-0 pointer-events-none z-40 hidden"></canvas>

  <!-- TOP BAR -->
  <header class="w-full border-b border-white/10 bg-black/30 backdrop-blur-md sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3 cursor-pointer" id="brandLogoBtn" title="Powrót do menu">
        <div class="w-11 h-11 rounded-2xl bg-gradient-to-br from-fuchsia-500 via-purple-600 to-indigo-600 flex items-center justify-center shadow-lg border border-white/20">
